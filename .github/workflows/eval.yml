# File: .github/workflows/eval.yml
# Runs the evaluation metrics (make eval) only when relevant paths change.
# NOTE: GitHub Actions has no job-level `paths:` filter, so the gating lives
# at the workflow level here — putting `paths:` on ci.yml's pull_request
# trigger would also suppress the existing lint/type/test jobs on unrelated
# PRs, so this is a separate workflow instead.
name: Eval

on:
  push:
    branches: [ main ]
    paths:
      - 'ara/nodes/**'
      - 'ara/eval/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/eval.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ara/nodes/**'
      - 'ara/eval/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/eval.yml'

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,eval]
      - name: Run evaluation metrics
        run: make eval
