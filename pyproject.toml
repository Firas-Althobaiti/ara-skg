[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ara-skg"
version = "0.1.0"
description = "LangGraph‑based Autonomous Research Assistant for scientific knowledge graphs"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings",
    "neo4j>=5.0",
    "chromadb>=0.4.0",
    "httpx>=0.27.0",
    "tenacity>=9.0",
    "structlog>=24.0",
    "rich>=13.0",
    "typer[all]>=0.12.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
]
