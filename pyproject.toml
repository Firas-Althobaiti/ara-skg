[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ara-skg"
version = "1.0.0"
description = "LangGraph-based Autonomous Research Assistant for scientific knowledge graphs"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings",
    "neo4j>=5.0",
    "networkx>=3.0",
    "chromadb>=0.4.0",
    "httpx>=0.27.0",
    "tenacity>=9.0",
    "structlog>=24.0",
    "rich>=13.0",
    "typer>=0.12.0",
    "langgraph-checkpoint-sqlite>=0.1.0",
]

[project.scripts]
ara = "ara.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "langgraph-checkpoint-sqlite>=2.0",
]
eval = [
    "pandas>=2.0",
    "tabulate>=0.9",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.setuptools.packages.find]
include = ["ara*"]

# --- إعدادات Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv", "vector_store", "artifacts", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# --- إعدادات Black ---
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
extend-exclude = '''
/(
    \.venv
  | venv
  | vector_store
  | artifacts
)/
'''

# --- إعدادات Mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# ── صرامة إضافية على كودك الخاص ────────────────────────────
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# ── تسامح مع المكتبات الخارجية بدون stubs ─────────────────
# هذا يحذف ~10 أخطاء فوراً (ChatOpenAI, chromadb, langchain...)
ignore_missing_imports = true

# ── Override: المكتبات الخارجية بدون type information ─────
[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "chromadb",
    "neo4j.*",
    "neo4j",
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langgraph.*",
    "langgraph.checkpoint.*",
    "langgraph.checkpoint.sqlite.*",
    "pydantic_settings.*",
    "structlog.*",
    "tenacity.*",
    "httpx.*",
    "aiosqlite.*",
    "arxiv.*",
    "Bio.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# ── Override: ملفات الاختبارات لا تحتاج صرامة كاملة ───────
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_return_any = false
# --- إعدادات Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# --- إعدادات Coverage ---
[tool.coverage.run]
source = ["ara"]
